name: P0.2 Browser Gate

on:
  push:
    branches:
      - p0/source-bbccdd-security-v3.3.3
    paths:
      - 'source-p0/assets/js/services/local-data.service.js'
      - 'source-p0/p0-outbox-smoke.html'
      - 'source-p0/p0-outbox-restart.html'
      - '.github/workflows/p02-browser-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: node --check source-p0/assets/js/services/local-data.service.js

      - name: Detect Chrome
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Chrome/Chromium absent du runner" >&2
            exit 1
          fi

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/p02-http.log 2>&1 &
          echo $! > /tmp/p02-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/source-p0/p0-outbox-smoke.html >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/p02-http.log
          exit 1

      - name: Run zero-build browser smoke
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/chrome-p02-smoke"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --user-data-dir="$PROFILE" --virtual-time-budget=10000 --dump-dom \
            http://127.0.0.1:8080/source-p0/p0-outbox-smoke.html > /tmp/p02-smoke.html
          cat /tmp/p02-smoke.html
          grep -q '<title>PASS P0.2</title>' /tmp/p02-smoke.html
          ! grep -q 'FAIL' /tmp/p02-smoke.html

      - name: Seed IndexedDB before browser restart
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/chrome-p02-restart"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --user-data-dir="$PROFILE" --virtual-time-budget=10000 --dump-dom \
            'http://127.0.0.1:8080/source-p0/p0-outbox-restart.html?phase=seed' > /tmp/p02-seed.html
          cat /tmp/p02-seed.html
          grep -q '<title>PASS P0.2 SEED</title>' /tmp/p02-seed.html
          grep -q 'PASS SEED pending=20' /tmp/p02-seed.html

      - name: Reopen browser and verify IndexedDB persistence
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/chrome-p02-restart"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --user-data-dir="$PROFILE" --virtual-time-budget=10000 --dump-dom \
            'http://127.0.0.1:8080/source-p0/p0-outbox-restart.html?phase=verify' > /tmp/p02-verify.html
          cat /tmp/p02-verify.html
          grep -q '<title>PASS P0.2 VERIFY</title>' /tmp/p02-verify.html
          grep -q 'PASS VERIFY persisted=20 acked=20' /tmp/p02-verify.html

      - name: Stop static server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/p02-http.pid ]; then kill "$(cat /tmp/p02-http.pid)" || true; fi
